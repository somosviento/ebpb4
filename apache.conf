# EBPB SPA static files under /ebpb/
Alias /ebpb/ "/var/www/ebpb/"
<Directory "/var/www/ebpb/">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresDefault "access plus 30 days"
    </IfModule>
    <IfModule mod_headers.c>
        Header set Cache-Control "public, max-age=2592000, immutable"
    </IfModule>

    <IfModule mod_dir.c>
        FallbackResource /ebpb/index.html
    </IfModule>
</Directory>

# EBPB API under /ebpb/api → backend /api on 127.0.0.1:8000
# El backend ya tiene API_PREFIX=/api configurado, así que mapeamos directamente
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"

ProxyPass        /ebpb/api http://127.0.0.1:8000/api
ProxyPassReverse /ebpb/api http://127.0.0.1:8000/api
